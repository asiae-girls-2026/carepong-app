# 케어퐁 — 자동 빌드·배포 (CI/CD)
# 하는 일: 버전 태그(v0.4.1 등)를 push 하거나 Actions 탭에서 수동 실행하면
#          → Windows에서 설치파일(.exe)을 빌드 → carepong-releases 레포에 Release 로 자동 업로드.
# 코드 저장소(carepong-app)는 Private, 설치파일 저장소(carepong-releases)는 Public — 둘이 다르므로
# 업로드에는 Secrets 의 RELEASE_TOKEN(carepong-releases 에 쓰기 가능한 토큰)이 필요하다.

name: Release (Windows build → carepong-releases)

on:
  push:
    tags:
      - 'v*' # v0.4.1, v0.5.0 처럼 v로 시작하는 태그를 올리면 자동 실행
  workflow_dispatch: # Actions 탭에서 수동 버튼으로도 실행 (버전을 직접 입력)
    inputs:
      version:
        description: '배포할 버전 (예: 0.4.1). 태그가 없을 때만 사용'
        required: true
        default: '0.4.1'

# 이 레포(carepong-app) 자체에 대한 기본 권한은 최소로 — 실제 업로드는 carepong-releases 쪽에 RELEASE_TOKEN 으로 한다.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest # 설치파일은 Windows 에서만 만들 수 있다
    defaults:
      run:
        working-directory: app # 소스·package.json 은 레포의 app/ 하위에 있다

    steps:
      # 1) 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node 설치 (package.json 의 electron/vite 와 맞는 LTS)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # 3) 버전 결정 — 태그면 태그에서(v0.4.1 → 0.4.1), 수동 실행이면 입력값
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"   # refs/tags/v0.4.1 → 0.4.1
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "빌드할 버전: $V"

      # 4) package.json 의 version 을 위에서 정한 값으로 맞춘다(태그와 어긋나지 않게)
      - name: Sync package.json version
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # 5) 의존성 설치 (lock 기준 정확 설치)
      - name: Install deps
        run: npm ci

      # 6) 빌드 — 설치파일 생성. 서명 끄기는 package.json(win.signtoolOptions.sign:null)에 이미 박혀 있다.
      #    혹시 모를 환경 자동서명까지 막기 위해 환경변수도 함께 끈다(이중 안전).
      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      # 7) 결과 확인 — exe 가 정말 MB 단위로 생겼는지 로그로 남긴다
      - name: Show artifacts
        shell: bash
        run: ls -lh release/*.exe

      # 8) carepong-releases 에 Release 생성 + exe 업로드
      #    토큰은 Secrets.RELEASE_TOKEN (carepong-releases 에 Contents: write 권한). 기본 GITHUB_TOKEN 은 타 레포에 못 써서 별도 토큰 사용.
      - name: Publish to carepong-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: asiae-girls-2026/carepong-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: app/release/CarePong-Setup-win-${{ steps.ver.outputs.version }}.exe
          fail_on_unmatched_files: true
